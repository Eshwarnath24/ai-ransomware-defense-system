# ============================================================
# AI Ransomware Defense System — Stage 1 Configuration
# ============================================================
# Edit this file to change monitored paths, DB location, and
# tuning parameters without touching any Python source code.

# -----------------------------------------------------------
# File Monitor settings
# -----------------------------------------------------------
monitor:
  paths:
    - "~/Downloads"
    - "~/Documents"
    - "~/Desktop"
  recursive: true          # Watch subdirectories too
  dedup_window_ms: 50      # Deduplicate identical file events arriving within 50ms

# -----------------------------------------------------------
# Process Monitor settings
# -----------------------------------------------------------
process_monitor:
  poll_interval_sec: 1.0   # How often to scan running processes
  hash_timeout_sec: 2.0    # Max seconds to spend hashing one binary
  skip_system_pids: true   # Skip PID 0, 4 (System/Idle on Windows)

# -----------------------------------------------------------
# Queue settings
# -----------------------------------------------------------
queue:
  maxsize: 100000          # Max events buffered before back-pressure (burst handling)
  join_timeout_sec: 0.5    # How long queue_joiner waits for a PID match

# -----------------------------------------------------------
# SQLite persistence
# -----------------------------------------------------------
database:
  path: "telemetry.db"     # Relative to project root
  wal_mode: true           # Enable WAL for concurrent read/write
  batch_size: 500          # Events to batch-insert per DB transaction

# -----------------------------------------------------------
# Logging
# -----------------------------------------------------------
logging:
  level: "INFO"            # DEBUG | INFO | WARNING | ERROR
  console: true
  file: "logs/stage1.log"

# -----------------------------------------------------------
# Stage 1 tuning (TDEW decay constant used by Stage 3,
# defined here so Stage 1 can tag events for downstream)
# -----------------------------------------------------------
telemetry:
  decay_lambda: 0.01       # lambda for TDEW (Stage 3 will read this)
  ecar_version: "1.0"

# -----------------------------------------------------------
# Stage 4: Feature Extraction & Hawkes Process
# -----------------------------------------------------------
stage_4:
  buffer_size: 4096          # 4KB post-write buffer sampling size
  hawkes:
    mu: 0.1                  # Background (baseline) event rate
    alpha: 0.5               # Excitation magnitude per event
    beta: 0.8                # Excitation decay rate
    lambda_max: 10.0         # Normalization saturation cap
    horizon_sec: 120.0       # Max lookback window for event timestamps
  etd:
    window_size: 50          # Rolling observation window per process
    s_etd_cap: 10.0          # KL-divergence normalization cap
  trajectory:
    max_fanout: 50           # Fan-out degree normalization cap
    max_target_rate: 20.0    # Max new-target rate (files/sec) for S_dev

# -----------------------------------------------------------
# Stage 5: Anomaly Scoring & Benign Profiling (DAC-OCF)
# -----------------------------------------------------------
stage_5:
  isolation_forest:
    n_estimators: 200          # Number of trees
    contamination: 0.05        # Expected outlier fraction in training data
    max_features: 0.8          # Feature fraction per tree
    random_state: 42           # Reproducibility seed
  one_class_svm:
    kernel: "rbf"              # RBF kernel for non-linear boundary
    nu: 0.1                    # Upper bound on training errors
    gamma: "scale"             # Kernel coefficient (1 / (n_features * X.var()))
  fusion_weights:
    isolation_forest: 0.6      # Weight for IF in DAC-OCF fusion
    one_class_svm: 0.4         # Weight for SVM in DAC-OCF fusion
  risk_thresholds:
    safe: 0.25                 # Below = SAFE tier
    watch: 0.50                # Below = WATCH tier
    suspect: 0.75              # Below = SUSPECT tier
  model_dir: "models"          # Directory for trained model artifacts
  dataset_path: "Dataset/RansomwareData.csv"  # Training dataset path

# -----------------------------------------------------------
# Stage 6: Multi-Signal Corroboration & Sigmoidal Acceleration
# -----------------------------------------------------------
stage_6:
  sigmoid:
    beta: 15.0                     # Steepness of the logistic curve
    theta: 0.50                    # Center threshold for sigmoid
  composite_weights:
    S_entropy: 0.35                # Content entropy priority (highest)
    S_dist: 0.30                   # Graph fan-out distance priority
    S_dev: 0.20                    # Trajectory velocity priority
    S_rel: 0.10                    # Lineage rarity priority
    S_stab: 0.05                   # Operational stability priority (inverted)
  threat_tiers:
    benign: 0.10                   # Below = BENIGN tier
    elevated: 0.40                 # Below = ELEVATED tier
    high: 0.75                     # Below = HIGH tier
                                   # Above = CRITICAL tier

# -----------------------------------------------------------
# Stage 7: Dynamic Adaptive Trust Evolution & Risk State Engine
# -----------------------------------------------------------
stage_7:
  gamma: 0.5                       # Exponential trust decay acceleration multiplier
  momentum_weight: 0.3             # Penalty weight for accelerating intent drift rate
  risk_thresholds:
    safe: 60.0                     # Trust >= 60.0: Normal operations (1x sampling)
    monitor: 35.0                  # Trust 35.0-59.9: Heightened awareness (2x sampling)
    verify: 20.0                   # Trust 20.0-34.9: Pre-warm write-ahead journal (4x sampling)
    critical_risk: 0.0             # Trust < 20.0: Immediate kernel containment trigger
  stale_pid_max_age_sec: 300.0     # Time after which inactive PID trust state is pruned

# -----------------------------------------------------------
# Stage 8: Synthetic Ransomware Test Harness
# -----------------------------------------------------------
stage_8:
  default_profile: "lockbit"       # Default simulated ransomware profile
  sandbox_dir: "sandbox_env"       # Directory for sandboxed victim environment
  default_num_files: 20            # Baseline victim file count
  profiles:
    lockbit:
      interval_ms: 20              # Fast multi-threaded burst writes
      batch_size: 5
      rename_ext: ".locked"
      drop_ransom_note: true
      note_filename: "Restore-My-Files.txt"
    wannacry:
      interval_ms: 50              # Burst file traversal and rename
      batch_size: 3
      rename_ext: ".WNCRY"
      drop_ransom_note: true
      note_filename: "@Please_Read_Me@.txt"
    blackcat:
      interval_ms: 250             # Low-and-slow stealth traversal
      batch_size: 1
      rename_ext: ".encrypted"
      drop_ransom_note: false

# -----------------------------------------------------------
# Stage 10: Fine-Grained Enforcer, Journaling & Rollback
# -----------------------------------------------------------
stage_10:
  vault_dir: ""                        # Empty = platform temp dir + .journal_vault
  block_size: 65536                    # mmap copy chunk size (64 KB)
  max_vault_bytes: 536870912           # 512 MB total vault cap
  max_file_bytes: 268435456            # 256 MB per-file cap
  always_on_journal: true              # Snapshot before every write regardless of tier
  dry_run: true                        # No real kill/ACL changes unless false


